<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>节气算法测试</title></head>
<body>
<h3>2025年节气日期测试（修正版算法）</h3>
<pre id="output"></pre>
<script>
var TERM_NAMES = ["立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒"];
var TERM_LONGITUDES = [315, 330, 345, 0, 15, 30, 45, 60, 75, 90, 105, 120,
                       135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300];

var RAD = Math.PI / 180;
function jdToDate(jd) { return new Date((jd - 2440587.5) * 86400000); }
function sunLongitude(jd) {
    var T = (jd - 2451545.0) / 36525;
    var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M * RAD)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * M * RAD)
          + 0.000289 * Math.sin(3 * M * RAD);
    var lon = L0 + C;
    return ((lon % 360) + 360) % 360;
}
function getTermDate(year, termIndex) {
    var targetLon = TERM_LONGITUDES[termIndex];
    var y = (termIndex >= 22) ? year + 1 : year;
    var startJD = 2451545.0 + (y - 2000) * 365.2422 + (termIndex * 15.2 - 45);
    var jd = startJD;
    for (var iter = 0; iter < 10; iter++) {
        var lon = sunLongitude(jd);
        var diff = (lon - targetLon + 360) % 360;
        if (diff > 180) diff -= 360;
        jd -= diff / 0.9856;
        if (Math.abs(diff) < 0.0001) break;
    }
    return jdToDate(jd);
}

var out = document.getElementById('output');
var text = '';
text += '2025年各节气日期:\n';
for (var i = 0; i < 24; i++) {
    var d = getTermDate(2025, i);
    var month = d.getMonth() + 1;
    var day = d.getDate();
    var h = d.getHours();
    var min = d.getMinutes();
    text += TERM_NAMES[i] + ': ' + month + '/' + day + ' ' + h + ':' + (min<10?'0':'') + min + '\n';
}

text += '\n2025年完整排序（含前后各一年）:\n';
var cand = [];
for (var y = 2024; y <= 2026; y++) {
    for (var i = 0; i < 24; i++) {
        cand.push({ date: getTermDate(y, i), name: TERM_NAMES[i] + '(' + y + ')' });
    }
}
cand.sort(function(a,b) { return a.date - b.date; });
for (var i = 0; i < cand.length; i++) {
    text += cand[i].name + ': ' + cand[i].date + '\n';
}

var now = new Date();
// 按日期比较，忽略时分秒
var nowMs = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
text += '\n当前时间: ' + now + '\n';
for (var i = 0; i < cand.length; i++) {
    var cd = new Date(cand[i].date.getFullYear(), cand[i].date.getMonth(), cand[i].date.getDate());
    if (cd.getTime() >= nowMs) {
        text += '下一个节气: ' + cand[i].name + ' -> ' + cand[i].date + '\n';
        if (i > 0) text += '上一个节气: ' + cand[i-1].name + ' -> ' + cand[i-1].date + '\n';
        break;
    }
}

out.textContent = text;
</script></body></html>
